<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A browser-based SWF player powered by Ruffle.">
    <title>SWF Player</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #151515;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .app {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 25px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-bottom: 15px;
        }

        button,
        .file-button {
            border: 1px solid #555;
            border-radius: 5px;
            padding: 10px 15px;
            background: #292929;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover,
        .file-button:hover {
            background: #414141;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .file-button {
            display: inline-block;
        }

        #fileInput {
            display: none;
        }

        .player-container {
            position: relative;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            width: 100%;
            height: 800px;
            min-height: 350px;
            flex: none;
            overflow: hidden;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
        }

        #player {
            position: relative;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #000;
        }

        #player ruffle-player {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .player-container:fullscreen {
            display: flex;
            width: 100%;
            height: 100%;
            min-height: 0;
            flex: none;
            border: 0;
            border-radius: 0;
            background: #000;
        }

        .player-container:fullscreen #player {
            width: 100%;
            height: 100%;
        }

        .player-container:fullscreen #player ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }

        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            color: #888;
            text-align: center;
            font-size: 16px;
        }

        .bottom-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 140px;
            accent-color: #ffffff;
            cursor: pointer;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            background: #222;
            border: 1px solid #333;
            border-radius: 5px;
            color: #aaa;
            overflow-wrap: anywhere;
        }

        .file-name {
            margin-top: 10px;
            color: #aaa;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .drop-active {
            outline: 3px dashed #888;
            outline-offset: -8px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 21px;
            }

            .player-container {
                height: 600px;
                min-height: 280px;
            }

            button,
            .file-button {
                padding: 9px 11px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <main class="app">

        <header>
            <h1>Shockwave Flash Player</h1>
        </header>

        <div class="toolbar">
            <label class="file-button" for="fileInput">
                Open SWF file
            </label>

            <input
                type="file"
                id="fileInput"
                accept=".swf,application/x-shockwave-flash"
            >

            <button id="reloadButton" disabled>
                Reload
            </button>

            <button id="unloadButton" disabled>
                Reset
            </button>

            <button id="fullscreenButton">
                Fullscreen
            </button>
        </div>

        <section class="player-container" id="playerContainer">
            <div id="player">
                <div class="placeholder" id="placeholder">
                    Open a SWF file to start playing Flash content.
                </div>
            </div>
        </section>

        <div class="file-name" id="fileName">
            No SWF file loaded
        </div>

        <div class="bottom-controls">
            <div class="volume-control">
                <label for="volumeSlider">Volume</label>

                <input
                    type="range"
                    id="volumeSlider"
                    min="0"
                    max="100"
                    value="100"
                >

                <span id="volumeValue">100%</span>
            </div>
        </div>

        <div class="status" id="status">
            Ready
        </div>

    </main>

    <script>
        // --------------------------------------------------
        // ELEMENTS
        // --------------------------------------------------

        const fileInput = document.getElementById("fileInput");
        const playerContainer = document.getElementById("playerContainer");
        const playerElement = document.getElementById("player");
        const placeholder = document.getElementById("placeholder");

        const reloadButton = document.getElementById("reloadButton");
        const unloadButton = document.getElementById("unloadButton");
        const fullscreenButton = document.getElementById("fullscreenButton");

        const volumeSlider = document.getElementById("volumeSlider");
        const volumeValue = document.getElementById("volumeValue");

        const fileNameElement = document.getElementById("fileName");
        const statusElement = document.getElementById("status");

        // --------------------------------------------------
        // VARIABLES
        // --------------------------------------------------

        let ruffleInstance = null;
        let currentFile = null;
        let currentURL = null;
        let resizeObserver = null;
        let loadGeneration = 0;

        // --------------------------------------------------
        // RUFFLE CONFIGURATION
        // --------------------------------------------------

        window.RufflePlayer = window.RufflePlayer || {};

        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "visible",
            backgroundColor: "#000000",
            letterbox: "on",
            contextMenu: "on",
            showSwfDownload: false,
            allowScriptAccess: false,
            quality: "high",
            scale: "showAll"
        };

        // --------------------------------------------------
        // STATUS
        // --------------------------------------------------

        function setStatus(message) {
            statusElement.textContent = message;
        }

        // --------------------------------------------------
        // PLAYER SIZING
        // --------------------------------------------------

        function updatePlayerSize() {
            if (!ruffleInstance) {
                return;
            }

            const rect = playerElement.getBoundingClientRect();

            if (rect.width <= 0 || rect.height <= 0) {
                return;
            }

            ruffleInstance.style.width = rect.width + "px";
            ruffleInstance.style.height = rect.height + "px";
        }

        function initializeResizeObserver() {
            if (resizeObserver) {
                resizeObserver.disconnect();
            }

            if (!("ResizeObserver" in window)) {
                window.addEventListener("resize", updatePlayerSize);
                return;
            }

            resizeObserver = new ResizeObserver(() => {
                updatePlayerSize();
            });

            resizeObserver.observe(playerContainer);
            resizeObserver.observe(playerElement);
        }

        // --------------------------------------------------
        // VOLUME
        // --------------------------------------------------

        function updateVolume() {
            const volume = Number(volumeSlider.value) / 100;

            volumeValue.textContent = volumeSlider.value + "%";

            if (ruffleInstance) {
                try {
                    ruffleInstance.volume = volume;
                } catch (error) {
                    console.warn("Could not update volume:", error);
                }
            }
        }

        // --------------------------------------------------
        // INITIALIZE RUFFLE
        // --------------------------------------------------

        async function initializeRuffle() {
            if (ruffleInstance) {
                return ruffleInstance;
            }

            if (!window.RufflePlayer) {
                throw new Error("Ruffle could not be loaded.");
            }

            const ruffle = window.RufflePlayer.newest();

            ruffleInstance = ruffle.createPlayer();

            ruffleInstance.style.display = "block";
            ruffleInstance.style.width = "100%";
            ruffleInstance.style.height = "100%";

            playerElement.innerHTML = "";
            playerElement.appendChild(ruffleInstance);

            updateVolume();
            initializeResizeObserver();
            updatePlayerSize();

            return ruffleInstance;
        }

        // --------------------------------------------------
        // LOAD SWF
        // --------------------------------------------------

        async function loadSWF(file) {
            if (!file) {
                return;
            }

            if (!file.name.toLowerCase().endsWith(".swf")) {
                setStatus("Error: Please select a valid SWF file.");
                return;
            }

            const generation = ++loadGeneration;

            if (currentURL) {
                URL.revokeObjectURL(currentURL);
                currentURL = null;
            }

            currentFile = file;
            currentURL = URL.createObjectURL(file);

            fileNameElement.textContent =
                "Loaded file: " + file.name;

            reloadButton.disabled = false;
            unloadButton.disabled = false;

            setStatus("Loading " + file.name + "...");

            try {
                await initializeRuffle();

                if (generation !== loadGeneration) {
                    return;
                }

                const player = ruffleInstance.ruffle();

                await player.load({
                    url: currentURL
                });

                if (generation !== loadGeneration) {
                    return;
                }

                updateVolume();
                updatePlayerSize();

                setStatus("Successfully loaded: " + file.name);

            } catch (error) {
                if (generation !== loadGeneration) {
                    return;
                }

                console.error("SWF loading error:", error);

                setStatus(
                    "Error loading SWF: " +
                    (error.message || String(error))
                );
            }
        }

        // --------------------------------------------------
        // RELOAD SWF
        // --------------------------------------------------

        async function reloadSWF() {
            if (!currentFile) {
                return;
            }

            setStatus("Reloading " + currentFile.name + "...");

            const file = currentFile;

            await loadSWF(file);
        }

        // --------------------------------------------------
        // UNLOAD SWF
        // --------------------------------------------------

        function unloadSWF() {
            loadGeneration++;

            if (currentURL) {
                URL.revokeObjectURL(currentURL);
                currentURL = null;
            }

            currentFile = null;

            if (resizeObserver) {
                resizeObserver.disconnect();
                resizeObserver = null;
            }

            if (ruffleInstance) {
                try {
                    ruffleInstance.remove();
                } catch (error) {
                    console.warn(error);
                }
            }

            ruffleInstance = null;

            playerElement.innerHTML = "";

            const newPlaceholder = document.createElement("div");
            newPlaceholder.className = "placeholder";
            newPlaceholder.textContent =
                "Open a SWF file to start playing.";

            playerElement.appendChild(newPlaceholder);

            fileNameElement.textContent = "No SWF file loaded";

            reloadButton.disabled = true;
            unloadButton.disabled = true;

            setStatus("Ready");
        }

        // --------------------------------------------------
        // MANUAL FULLSCREEN
        // --------------------------------------------------

        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await playerContainer.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.error("Fullscreen error:", error);
                setStatus("Could not change fullscreen mode.");
            }
        }

        document.addEventListener("fullscreenchange", () => {
            fullscreenButton.textContent =
                document.fullscreenElement
                    ? "Exit Fullscreen"
                    : "Fullscreen";

            requestAnimationFrame(updatePlayerSize);
        });

        // --------------------------------------------------
        // FILE INPUT
        // --------------------------------------------------

        fileInput.addEventListener("change", event => {
            const file = event.target.files[0];

            if (file) {
                loadSWF(file);
            }

            fileInput.value = "";
        });

        // --------------------------------------------------
        // BUTTON EVENTS
        // --------------------------------------------------

        reloadButton.addEventListener("click", reloadSWF);

        unloadButton.addEventListener("click", unloadSWF);

        fullscreenButton.addEventListener("click", toggleFullscreen);

        volumeSlider.addEventListener("input", updateVolume);

        // --------------------------------------------------
        // DRAG AND DROP
        // --------------------------------------------------

        playerContainer.addEventListener("dragover", event => {
            event.preventDefault();
            playerContainer.classList.add("drop-active");
        });

        playerContainer.addEventListener("dragleave", event => {
            if (!playerContainer.contains(event.relatedTarget)) {
                playerContainer.classList.remove("drop-active");
            }
        });

        playerContainer.addEventListener("drop", event => {
            event.preventDefault();

            playerContainer.classList.remove("drop-active");

            const file = event.dataTransfer.files[0];

            if (file) {
                loadSWF(file);
            }
        });

        // --------------------------------------------------
        // KEYBOARD SHORTCUTS
        // --------------------------------------------------

        // Ctrl + O opens a SWF file.
        // There is NO F-key fullscreen shortcut.

        document.addEventListener("keydown", event => {
            const target = event.target;

            if (
                target instanceof HTMLInputElement ||
                target instanceof HTMLTextAreaElement ||
                target instanceof HTMLSelectElement ||
                target.isContentEditable
            ) {
                return;
            }

            if (
                event.ctrlKey &&
                !event.shiftKey &&
                !event.altKey &&
                event.key.toLowerCase() === "o"
            ) {
                event.preventDefault();
                fileInput.click();
            }
        });

        // --------------------------------------------------
        // PAGE CLEANUP
        // --------------------------------------------------

        window.addEventListener("pagehide", () => {
            if (currentURL) {
                URL.revokeObjectURL(currentURL);
                currentURL = null;
            }
        });

        // --------------------------------------------------
        // INITIALIZATION
        // --------------------------------------------------

        window.addEventListener("load", () => {
            if (!window.RufflePlayer) {
                setStatus("Error: Ruffle failed to load.");
                return;
            }

            setStatus("Ready");
        });

    </script>
</body>
</html>

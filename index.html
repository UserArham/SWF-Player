<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" 
      type="image/png" 
      href="/Adobe Flash-Player.png">
    <title>SWF Player</title>

    <meta name="description" content="A simple browser-based SWF player powered by Ruffle.">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            background: #181818;
            color: #eeeeee;
            font-family: Roboto, Arial, sans-serif;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #222222;
            border-bottom: 1px solid #383838;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 20px;
            background: #222222;
            border-bottom: 1px solid #383838;
        }

        button,
        .file-button {
            padding: 9px 14px;
            border: 1px solid #555555;
            border-radius: 4px;
            background: #333333;
            color: #eeeeee;
            font-size: 13px;
            cursor: pointer;
        }

        button:hover,
        .file-button:hover {
            background: #444444;
        }

        button:active,
        .file-button:active {
            background: #292929;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #fileInput {
            display: none;
        }

        .main {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 16px;
        }

        /* Fixed-size player: no flex growth or viewport resizing. */

        .player-container {
        height: 800px;
        min-height: 350px;
        flex: none;
  }

      @media (max-width: 600px) {
        .player-container {
          height: 600px;
         min-height: 280px;
      }
  }
        #player {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #000000;
        }

        #player ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            border: 0;
            outline: 0;
            background: #000000;
        }

        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-height: 350px;
            padding: 20px;
            color: #999999;
            font-size: 14px;
            text-align: center;
        }

        .information {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 0 0;
            color: #aaaaaa;
            font-size: 13px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 110px;
            accent-color: #aaaaaa;
        }

        footer {
            padding: 12px 20px;
            background: #222222;
            border-top: 1px solid #383838;
            color: #888888;
            font-size: 12px;
        }

        /* Manual fullscreen. */

        .player-container:fullscreen {
            display: flex;
            width: 100%;
            height: 100%;
            min-height: 0;
            flex: none;
            border: 0;
            border-radius: 0;
            background: #000000;
        }

        .player-container:fullscreen #player {
            width: 100%;
            height: 100%;
        }

        .player-container:fullscreen #player ruffle-player {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 600px) {
            header {
                padding: 12px;
            }

            .toolbar {
                padding: 10px 12px;
            }

            .main {
                padding: 10px;
            }

            .player-container {
                height: 450px;
                min-height: 280px;
            }

            button,
            .file-button {
                padding: 9px 11px;
            }
        }
    </style>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};

        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "visible",

            backgroundColor: "#000000",

            letterbox: "on",
            contextMenu: "on",

            showSwfDownload: false,
            allowScriptAccess: false,

            quality: "high",
            scale: "showAll"
        };
    </script>

    <script
        src="https://unpkg.com/@ruffle-rs/ruffle"
        defer>
    </script>
</head>

<body>

<div class="app">

    <header>
        <h1>Shockwave Flash Player</h1>
    </header>

    <div class="toolbar">

        <label class="file-button" for="fileInput">
            Open SWF
        </label>

        <input
            type="file"
            id="fileInput"
            accept=".swf,application/x-shockwave-flash">

        <button id="reloadButton" disabled>
            Reload
        </button>

        <button id="unloadButton" disabled>
            Unload
        </button>

        <button id="fullscreenButton">
            Fullscreen
        </button>

    </div>

    <main class="main">

        <div class="player-container" id="playerContainer">

            <div id="player">
                <div class="placeholder">
                    Open a SWF file to begin.
                </div>
            </div>

        </div>

        <div class="information">

            <div id="fileName">
                No file loaded yet
            </div>

            <div class="volume-control">

                <label for="volumeSlider">
                    Volume
                </label>

                <input
                    type="range"
                    id="volumeSlider"
                    min="0"
                    max="100"
                    value="100">

            </div>

        </div>

    </main>

    <footer>
        Powered by Ruffle
        <span id="status"> | Ready</span>
    </footer>

</div>

<script>
    const fileInput = document.getElementById("fileInput");

    const playerContainer = document.getElementById("playerContainer");
    const playerElement = document.getElementById("player");

    const reloadButton = document.getElementById("reloadButton");
    const unloadButton = document.getElementById("unloadButton");
    const fullscreenButton = document.getElementById("fullscreenButton");

    const fileNameElement = document.getElementById("fileName");
    const statusElement = document.getElementById("status");

    const volumeSlider = document.getElementById("volumeSlider");

    let ruffleInstance = null;
    let currentFile = null;
    let currentURL = null;
    let loadGeneration = 0;
    let resizeObserver = null;

    function setStatus(message) {
        statusElement.textContent = " | " + message;
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };

            return entities[character];
        });
    }

    function updatePlayerSize() {
        if (!ruffleInstance) {
            return;
        }

        const rect = playerElement.getBoundingClientRect();

        ruffleInstance.style.width = Math.max(1, rect.width) + "px";
        ruffleInstance.style.height = Math.max(1, rect.height) + "px";
    }

    function initializeResizeObserver() {
        if (resizeObserver) {
            resizeObserver.disconnect();
        }

        resizeObserver = new ResizeObserver(() => {
            updatePlayerSize();
        });

        resizeObserver.observe(playerContainer);
    }

    function initializeRuffle() {
        if (!window.RufflePlayer) {
            setStatus("Ruffle is not available");
            return false;
        }

        try {
            playerElement.innerHTML = "";

            const ruffle = window.RufflePlayer.newest();

            ruffleInstance = ruffle.createPlayer();

            ruffleInstance.style.display = "block";
            ruffleInstance.style.width = "100%";
            ruffleInstance.style.height = "100%";
            ruffleInstance.style.border = "0";
            ruffleInstance.style.outline = "0";
            ruffleInstance.style.backgroundColor = "#000000";

            playerElement.appendChild(ruffleInstance);

            ruffleInstance.ruffle().volume =
                Number(volumeSlider.value) / 100;

            initializeResizeObserver();
            updatePlayerSize();

            return true;

        } catch (error) {
            setStatus("Could not initialize Ruffle");
            console.error(error);

            return false;
        }
    }

    async function loadSWF(file) {
        if (!file) {
            return;
        }

        if (!file.name.toLowerCase().endsWith(".swf")) {
            setStatus("Please select a SWF file");
            return;
        }

        const generation = ++loadGeneration;

        currentFile = file;

        if (currentURL) {
            URL.revokeObjectURL(currentURL);
            currentURL = null;
        }

        currentURL = URL.createObjectURL(file);

        fileNameElement.textContent = file.name;

        reloadButton.disabled = false;
        unloadButton.disabled = false;

        setStatus("Loading " + file.name);

        if (!ruffleInstance && !initializeRuffle()) {
            return;
        }

        try {
            await ruffleInstance.ruffle().load({
                url: currentURL
            });

            if (generation !== loadGeneration) {
                return;
            }

            setStatus("Loaded " + file.name);

            ruffleInstance.ruffle().volume =
                Number(volumeSlider.value) / 100;

            updatePlayerSize();

            // No automatic fullscreen.

        } catch (error) {
            if (generation !== loadGeneration) {
                return;
            }

            console.error(error);

            setStatus("Failed to load SWF");

            playerElement.innerHTML = `
                <div class="placeholder">
                    Could not load this SWF file.
                    <br><br>
                    ${escapeHTML(error.message || "Unknown error")}
                </div>
            `;

            ruffleInstance = null;
        }
    }

    async function reloadSWF() {
        if (!currentFile) {
            return;
        }

        const generation = ++loadGeneration;

        if (!currentURL) {
            currentURL = URL.createObjectURL(currentFile);
        }

        setStatus("Reloading");

        if (!ruffleInstance && !initializeRuffle()) {
            return;
        }

        try {
            await ruffleInstance.ruffle().load({
                url: currentURL
            });

            if (generation !== loadGeneration) {
                return;
            }

            ruffleInstance.ruffle().volume =
                Number(volumeSlider.value) / 100;

            updatePlayerSize();

            setStatus("Reloaded");

            // No automatic fullscreen.

        } catch (error) {
            console.error(error);
            setStatus("Reload failed");
        }
    }

    function unloadSWF() {
        loadGeneration++;

        if (currentURL) {
            URL.revokeObjectURL(currentURL);
            currentURL = null;
        }

        currentFile = null;

        if (resizeObserver) {
            resizeObserver.disconnect();
            resizeObserver = null;
        }

        ruffleInstance = null;

        playerElement.innerHTML = `
            <div class="placeholder">
                Open a SWF file to begin.
            </div>
        `;

        fileNameElement.textContent = "No file loaded yet";

        reloadButton.disabled = true;
        unloadButton.disabled = true;

        fileInput.value = "";

        setStatus("Ready");
    }

    async function toggleFullscreen() {
        try {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
            } else {
                await playerContainer.requestFullscreen();
            }
        } catch (error) {
            console.error("Fullscreen error:", error);
            setStatus("Fullscreen unavailable");
        }
    }

    fileInput.addEventListener("change", event => {
        const file = event.target.files[0];

        if (file) {
            loadSWF(file);
        }
    });

    reloadButton.addEventListener("click", reloadSWF);

    unloadButton.addEventListener("click", unloadSWF);

    fullscreenButton.addEventListener("click", toggleFullscreen);

    volumeSlider.addEventListener("input", () => {
        if (ruffleInstance) {
            ruffleInstance.ruffle().volume =
                Number(volumeSlider.value) / 100;
        }
    });

    playerContainer.addEventListener("dragover", event => {
        event.preventDefault();
    });

    playerContainer.addEventListener("drop", event => {
        event.preventDefault();

        const file = event.dataTransfer.files[0];

        if (file) {
            loadSWF(file);
        }
    });

    document.addEventListener("fullscreenchange", () => {
        updatePlayerSize();
    });

    document.addEventListener("keydown", event => {
        const target = event.target;

        if (
            target instanceof HTMLInputElement ||
            target instanceof HTMLTextAreaElement
        ) {
            return;
        }

        if (event.ctrlKey && event.key.toLowerCase() === "o") {
            event.preventDefault();
            fileInput.click();
        }

        if (
            event.key.toLowerCase() === "f" &&
            !event.ctrlKey &&
            !event.altKey
        ) {
            event.preventDefault();
            toggleFullscreen();
        }
    });

    window.addEventListener("pagehide", () => {
        if (currentURL) {
            URL.revokeObjectURL(currentURL);
            currentURL = null;
        }
    });

    window.addEventListener("load", () => {
        if (initializeRuffle()) {
            setStatus("Ready");
        }
    });

</script>

</body>
</html>
